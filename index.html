<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小侦探">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<title>小侦探学习工作台</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#f2f6f3;color:#1f2937;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;touch-action:manipulation}
.shell{display:flex;min-height:100vh}
/* ---------- 左侧导航 ---------- */
#nav{width:212px;flex:none;background:linear-gradient(180deg,#0c4d33,#0a3f2a);color:#d7e9dd;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:700;font-size:17px;color:#fff;letter-spacing:.5px}
.brand .lg{width:34px;height:34px;border-radius:10px;background:#17a34a;display:flex;align-items:center;justify-content:center;font-size:19px}
.navi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#cfe3d6;font-size:15px;padding:13px 14px;border-radius:12px;cursor:pointer;text-align:left;margin-bottom:6px;font-family:inherit;min-height:46px}
.navi.on{background:#17a34a;color:#fff;font-weight:600;box-shadow:0 4px 10px rgba(23,163,74,.35)}
.navi .ic{font-size:18px;width:22px;text-align:center}
.nbadge{margin-left:auto;background:rgba(255,255,255,.18);border-radius:12px;font-size:12px;padding:1px 9px;min-width:26px;text-align:center}
.navi.on .nbadge{background:rgba(255,255,255,.28)}
.navfoot{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:8px}
.navfoot img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #2e7d55}
.navfoot .who{font-size:12.5px;line-height:1.35}
.navfoot .who b{color:#fff;font-size:13px;display:block}
.nfootbtns{display:flex;gap:6px;margin-top:10px}
.nfootbtns button{flex:1;background:rgba(255,255,255,.10);border:0;color:#d7e9dd;border-radius:9px;padding:9px 0;font-size:13px;cursor:pointer;font-family:inherit;min-height:40px}
.nfootbtns button:hover{background:rgba(255,255,255,.2)}
/* ---------- 主区 ---------- */
#main{flex:1;min-width:0;padding:20px 22px 60px;max-width:1060px;margin:0 auto;width:100%}
.hero{display:flex;justify-content:space-between;align-items:center;gap:14px;background:linear-gradient(115deg,#e7f6ec,#f4fbf7 60%,#fdf2f2);border:1px solid #dcebe1;border-radius:18px;padding:20px 24px;margin-bottom:16px}
.hero h1{margin:0 0 4px;font-size:23px}
.hero p{margin:0;color:#5b6b60;font-size:14px}
.hero img{width:126px;height:126px;border-radius:18px;object-fit:cover;flex:none;box-shadow:0 6px 16px rgba(12,77,51,.18)}
.card{background:#fff;border:1px solid #e4eae5;border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.kcard{border-radius:14px;padding:14px 16px;font-size:13.5px;border:1px solid transparent}
.kcard b{display:block;font-size:24px;margin:2px 0;line-height:1.3}
.k-g{background:#e7f6ec;color:#166534;border-color:#d3ecd9}
.k-y{background:#fdf6e3;color:#92400e;border-color:#f5e5bd}
.k-r{background:#fdecec;color:#b91c1c;border-color:#f6d3d3}
.k-p{background:#f3efff;color:#5b21b6;border-color:#e3dbfa}
.tiny{font-size:12.5px;color:#6b7a70}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;vertical-align:middle}
.tag.g{background:#e7f6ec;color:#166534}
.tag.y{background:#fdf6e3;color:#92400e}
.tag.r{background:#fdecec;color:#b91c1c}
.tag.p{background:#f3efff;color:#5b21b6}
.bar{height:10px;background:#edf2ee;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:#17a34a;transition:width .3s}
.btn{background:#fff;border:1.5px solid #cfdad2;color:#243328;border-radius:11px;padding:10px 18px;font-size:14.5px;cursor:pointer;font-family:inherit;min-height:44px}
.btn.primary{background:#17a34a;border-color:#17a34a;color:#fff;font-weight:600}
.btn.warn{background:#f59e0b;border-color:#f59e0b;color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 13px;min-height:38px;font-size:13.5px;border-radius:9px}
/* ---------- 今日打卡 ---------- */
.todo{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid #e4eae5;border-radius:13px;margin-bottom:10px;cursor:pointer;background:#fff;min-height:58px}
.todo.checked{background:#f2fbf5;border-color:#9fdcb6}
.todo .box{width:32px;height:32px;flex:none;border:2.5px solid #c7d3ca;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#fff;transition:all .15s}
.todo.checked .box{background:#17a34a;border-color:#17a34a}
.todo .lbl{flex:1;min-width:0;font-size:15.5px}
.todo.checked .lbl{color:#166534;font-weight:600}
.todo .pts{font-size:13px;color:#92400e;background:#fdf6e3;border-radius:14px;padding:2px 10px;flex:none}
.todo .del{border:0;background:none;color:#b3c1b7;font-size:16px;cursor:pointer;padding:6px;flex:none}
.addrow{display:flex;gap:10px;margin-top:6px}
.addrow input{flex:1;border:1.5px solid #cfdad2;border-radius:11px;padding:11px 14px;font-size:15px;font-family:inherit;min-height:46px}
.ring{--p:0;width:104px;height:104px;border-radius:50%;background:conic-gradient(#17a34a calc(var(--p)*1%),#e2e9e3 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring b{width:78px;height:78px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px}
/* ---------- 数学 ---------- */
.todaytask{display:flex;align-items:center;gap:12px;background:#fffdf3;border-color:#f2e3b3}
.todaytask .tt{flex:1;min-width:0;font-size:14.5px}
.mathwrap{display:flex;gap:14px;align-items:flex-start}
.mathside{width:296px;flex:none}
.mathpanel{flex:1;min-width:0}
.acc{background:#fff;border:1px solid #e4eae5;border-radius:13px;margin-bottom:10px;overflow:hidden}
.acc h4{margin:0;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;font-size:14.5px;cursor:pointer}
.acc h4 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.acc .bd{border-top:1px solid #eef2ee}
.stageitem{display:flex;gap:10px;padding:11px 14px;cursor:pointer;align-items:center;border-bottom:1px dashed #f0f4f1}
.stageitem:last-child{border-bottom:0}
.stageitem.sel{background:#f2fbf5}
.stageitem.lock{opacity:.5;cursor:not-allowed}
.stageitem .ic{font-size:16px}
.stageitem .st{font-size:12px;color:#6b7a70}
.phead{background:#fff;border:1px solid #e4eae5;border-radius:14px;padding:16px 18px;margin-bottom:12px}
.phead h2{margin:0 0 4px;font-size:19px}
.sub{color:#6b7a70;font-size:13px}
.note{background:#f6faf7;border:1px solid #e2ece5;border-radius:11px;padding:11px 14px;font-size:13.5px;margin-top:10px}
.sec{margin:18px 0 10px;font-size:15px;padding-left:10px;border-left:4px solid #17a34a}
.focus{margin:0;padding-left:20px;font-size:14px}
.focus li{margin:3px 0}
.plan .d{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid #e8eee9;border-radius:11px;margin-bottom:8px;background:#fff}
.plan .d.done{background:#f2fbf5;border-color:#bfe6cd}
.plan .n{width:30px;height:30px;flex:none;border-radius:50%;background:#edf2ee;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700}
.plan .d.done .n{background:#17a34a;color:#fff}
.plan .txt{flex:1;min-width:0;font-size:14px}
.q{background:#fff;border:1.5px solid #e4eae5;border-radius:13px;padding:14px 16px;margin-bottom:12px}
.q.right{border-color:#4ade80;background:#f4fdf6}
.q.wrong{border-color:#f87171;background:#fef5f5}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.qn{font-size:13px;color:#6b7a70;font-weight:600}
.stem{font-size:15.5px;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:1.5px solid #cfdad2;background:#fff;border-radius:11px;padding:10px 16px;font-size:14.5px;cursor:pointer;font-family:inherit;min-height:44px}
.opt.on{border-color:#17a34a;background:#f2fbf5;font-weight:600}
input.fld,input[data-fill]{border:1.5px solid #cfdad2;border-radius:11px;padding:11px 14px;font-size:15px;font-family:inherit;min-height:46px}
.ex{margin-top:10px;font-size:13.5px;color:#256029;background:#f0f9f1;border-radius:9px;padding:9px 12px}
.q.wrong .ex{background:#fdf1f1;color:#8c2f2f}
.grade{border-radius:13px;padding:16px 18px;font-size:14.5px}
.grade.pass{background:#e7f6ec;border:1px solid #9fdcb6}
.grade.fail{background:#fdf6e3;border:1px solid #f0dfae}
.hr{height:1px;background:#eef2ee;margin:12px 0}
/* ---------- 错题 / 跳绳 / 奖励 ---------- */
.mcard{background:#fff;border:1.5px solid #e4eae5;border-radius:13px;padding:14px 16px;margin-bottom:12px}
.mcard.solved{opacity:.75;background:#fbfdfb}
.mhead{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.ropeTime{font-size:58px;font-weight:800;text-align:center;letter-spacing:2px;color:#0c4d33;margin:10px 0;font-variant-numeric:tabular-nums}
.hist{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dashed #eef2ee;font-size:13.5px}
.hist:last-child{border-bottom:0}
.hist .x{font-weight:700;flex:none}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);background:#0c4d33;color:#fff;padding:11px 22px;border-radius:24px;font-size:14.5px;z-index:99;transition:transform .25s;max-width:86vw}
#toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(10,30,20,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.mbox{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:86vh;overflow-y:auto;padding:20px 22px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border:1px solid #e8eee9;padding:8px 10px;text-align:left}
th{background:#f4f8f5}
/* ---------- iPad 竖屏 / 窄屏 ---------- */
@media (max-width:880px){
  .shell{flex-direction:column}
  #nav{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto;gap:6px}
  .brand{padding:0 8px 0 2px;white-space:nowrap;font-size:15px}
  .navi{width:auto;white-space:nowrap;margin-bottom:0;padding:10px 13px;min-height:42px}
  .navfoot{margin:0;padding:0;border:0}
  .navfoot img,.navfoot .who{display:none}
  .nfootbtns{margin:0}
  .nfootbtns button{padding:8px 12px}
  .mathwrap{flex-direction:column}
  .mathside{width:100%}
  .hero img{width:96px;height:96px}
  .grid3{grid-template-columns:1fr 1fr}
  #main{padding:14px 14px 50px}
}
@media print{#nav{display:none}}
</style>
</head>
<body>
<div class="shell">
  <nav id="nav">
    <div class="brand"><span class="lg">🕵️</span>小侦探工作台</div>
    <button class="navi" data-view="checkin"><span class="ic">✅</span>今日打卡<span class="nbadge" id="nbCheck">0</span></button>
    <button class="navi" data-view="math"><span class="ic">🔍</span>数学闯关<span class="nbadge" id="nbMath">0</span></button>
    <button class="navi" data-view="mistake"><span class="ic">🧩</span>错题本<span class="nbadge" id="nbMis">0</span></button>
    <button class="navi" data-view="rope"><span class="ic">🏃</span>跳绳运动</button>
    <button class="navi" data-view="reward"><span class="ic">🎁</span>奖励兑换<span class="nbadge" id="nbPts">0</span></button>
    <div class="navfoot">
      <img id="avatar" alt="头像">
      <div class="who"><b>小小侦探</b>真相只有一个！</div>
    </div>
    <div class="nfootbtns">
      <button id="btnSettings">设置</button>
      <button id="btnExport">导出</button>
      <button id="btnImport">导入</button>
    </div>
  </nav>
  <main id="main"></main>
</div>
<div id="toast"></div>
<input type="file" id="fileImport" accept=".json" hidden>

/* ===== 确定性随机（同一阶段 + 同一套次，题面稳定；换一套才变） ===== */
function rngFrom(seed){
  var s = seed >>> 0;
  return function(){
    s += 0x6D2B79F5;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(str){
  var h = 2166136261 >>> 0;
  for (var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function ri(rng,a,b){ if(b<a){var t=a;a=b;b=t;} return a + Math.floor(rng()*(b-a+1)); }
function pick(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }
function shuffle(rng,arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function normAns(s){ return String(s==null?'':s).replace(/\s+/g,'').replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);}).replace(/[。．]/g,''); }

/* ===== 出题引擎：统一返回 {stem,type,answer,options?,explain,tag} ===== */

  add: function(rng,p){
    p=p||{}; var max=p.max||10, a,b;
    if(p.carry){ a=ri(rng,5,9); b=ri(rng,11-a,9); }
    else { a=ri(rng,1,Math.max(1,max-1)); b=ri(rng,0,max-a); }
    return {stem:a+' + '+b+' = ?',type:'fill',answer:String(a+b),explain:'算理：'+a+' 加 '+b+'，结果是 '+(a+b)+'。'+(p.carry?'凑十：把 '+b+' 拆出 '+(10-a)+' 先凑成 10。':''),tag:'加法'};
  },
  sub: function(rng,p){

    if(kind==='direction'){

    if(kind==='transform'){
      var B7=[['电梯上下移动是什么运动？','平移',['平移','旋转','轴对称','都不是']],['钟面上指针的走动是什么运动？','旋转',['平移','旋转','轴对称','都不是']],['蝴蝶左右两翅是什么关系？','轴对称',['平移','旋转','轴对称','都不是']],['正方形有几条对称轴？','4',['1','2','3','4']]];
      var it7=pick(rng,B7), o7=shuffle(rng,it7[2].slice());
      return {stem:it7[0],type:'choice',options:o7,answer:it7[1],explain:'答案：'+it7[1]+'。',tag:'平移旋转对称'};
    }
    if(kind==='peri'){
      var L=ri(rng,4,15), W=ri(rng,2,L);
      if(rng()<0.5) return {stem:'长 '+L+' 厘米、宽 '+W+' 厘米的长方形，周长是多少厘米？',type:'fill',answer:String(2*(L+W)),explain:'周长=(长+宽)×2=('+L+'+'+W+')×2='+(2*(L+W))+' 厘米。',tag:'周长'};
      var s=ri(rng,3,12);
      return {stem:'边长 '+s+' 厘米的正方形，周长是多少厘米？',type:'fill',answer:String(4*s),explain:'正方形周长=边长×4='+s+'×4='+(4*s)+' 厘米。',tag:'周长'};

    if(kind==='area'){
      var L2=ri(rng,3,12), W2=ri(rng,2,9);
      if(rng()<0.5) return {stem:'长 '+L2+' 厘米、宽 '+W2+' 厘米的长方形，面积是多少平方厘米？',type:'fill',answer:String(L2*W2),explain:'面积=长×宽='+L2+'×'+W2+'='+(L2*W2)+' 平方厘米。',tag:'面积'};
      var s2=ri(rng,2,10);
      return {stem:'边长 '+s2+' 厘米的正方形，面积是多少平方厘米？',type:'fill',answer:String(s2*s2),explain:'正方形面积=边长×边长='+s2+'×'+s2+'='+(s2*s2)+' 平方厘米。',tag:'面积'};

  },
  pattern: function(rng,p){
    p=p||{}; var max=p.max||30, mode=ri(rng,1,4);
    if(max<40 && mode===2) mode=1; /* 低年级阶段不放大倍数数列，避免数值超出认知范围 */
    if(mode===1){ var a=ri(rng,1,Math.min(9,max)), d=ri(rng,2,Math.min(9,Math.max(2,Math.floor(max/4))));

    if(mode===3){ var unit=pick(rng,['○△△','○△□','△□○']), ans=unit[2], opts=shuffle(rng,['○','△','□']);
      return {stem:'按规律：'+unit+unit+unit.slice(0,2)+'……下一个图形是？',type:'choice',options:opts,answer:ans,explain:'重复的一组是「'+unit+'」，已给出 8 个图形，第 9 个回到这一组的第 3 个，所以是 '+ans+'。',tag:'找规律'}; }
    var c=ri(rng,10,Math.min(80,max)), dd=ri(rng,2,8);
    return {stem:'按规律填数：'+c+'、'+(c-dd)+'、'+(c-2*dd)+'、( )',type:'fill',answer:String(c-3*dd),explain:'每次减 '+dd+'，下一个是 '+(c-2*dd)+'-'+dd+'='+(c-3*dd)+'。',tag:'找规律'};
  },
  dataStat: function(rng,p){
    p=p||{}; var kind=p.kind||'simple';
    var labels=['苹果','香蕉','梨','橘子','西瓜'];
    var vals=[], used={};
    while(vals.length<4){ var v=ri(rng,1,12); if(!used[v]){ used[v]=1; vals.push(v); } }
    var sum=vals.reduce(function(a,b){return a+b;},0), mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals);
    var intro='分类记录：'+labels[0]+' '+vals[0]+' 个、'+labels[1]+' '+vals[1]+' 个、'+labels[2]+' '+vals[2]+' 个、'+labels[3]+' '+vals[3]+' 个。';
    if(kind==='tally'){
      var z=ri(rng,1,4), extra=ri(rng,0,4), count=z*5+extra;
      return {stem:'用「正」字记录数据：'+ '正'.repeat(z) + (extra?' 再加 '+extra+' 笔':'') +'，一共记录了多少次？（一个「正」字 5 次）',type:'fill',answer:String(count),explain:z+' 个「正」字是 '+(z*5)+' 次，再加 '+extra+' 笔，共 '+count+' 次。',tag:'数据记录'};
    }
    if(kind==='prob'){
      var r=ri(rng,3,9), w=ri(rng,1,r-1), opts=shuffle(rng,['红球','白球','一样大']);
      return {stem:'袋里 '+r+' 个红球、'+w+' 个白球，摸一个，摸到哪种球的可能性大？',type:'choice',options:opts,answer:'红球',explain:'红球 '+r+' 个比白球 '+w+' 个多，摸到红球的可能性大。',tag:'可能性'};
    }
    if(kind==='avg'){
      var n=ri(rng,3,5), arr=[], tot=0;
      for(var i=0;i<n;i++){ var v=ri(rng,2,20); arr.push(v); tot+=v; }
      var avg=tot/n;
      if(avg!==Math.floor(avg)){ arr[n-1]+= (n-tot%n)%n; tot=arr.reduce(function(a,b){return a+b;},0); avg=tot/n; }
      return {stem:'求 '+arr.join('、')+' 这 '+n+' 个数的平均数。',type:'fill',answer:String(avg),explain:'先求总数 '+tot+'，再除以份数 '+n+'：'+tot+'÷'+n+'='+avg+'。',tag:'平均数'};
    }
    if(kind==='chart'){
      var days=['周一','周二','周三','周四'];
      var k2=ri(rng,1,3);
      if(k2===1) return {stem:'条形图：周一 '+vals[0]+' 票、周二 '+vals[1]+' 票、周三 '+vals[2]+' 票、周四 '+vals[3]+' 票。哪天票数最多？',type:'choice',options:shuffle(rng,days.slice()),answer:days[vals.indexOf(mx)],explain:'比较四天，最大是 '+mx+' 票，对应 '+days[vals.indexOf(mx)]+'。',tag:'读统计图'};
      if(k2===2) return {stem:'条形图：周一 '+vals[0]+' 票、周二 '+vals[1]+' 票、周三 '+vals[2]+' 票、周四 '+vals[3]+' 票。四天一共多少票？',type:'fill',answer:String(sum),explain:'把四天加起来：'+vals.join('+')+'='+sum+' 票。',tag:'读统计图'};
      return {stem:'条形图：周一 '+vals[0]+' 票、周二 '+vals[1]+' 票、周三 '+vals[2]+' 票、周四 '+vals[3]+' 票。最多的一天比最少的一天多几票？',type:'fill',answer:String(mx-mn),explain:'最多 '+mx+' 票、最少 '+mn+' 票，相差 '+(mx-mn)+' 票。',tag:'读统计图'};
    }
    var q=ri(rng,1,4);
    if(q===1) return {stem:intro+'一共有多少个？',type:'fill',answer:String(sum),explain:'四类相加：'+vals.join('+')+'='+sum+' 个。',tag:'数据整理'};
    if(q===2) return {stem:intro+'最多的比最少的多几个？',type:'fill',answer:String(mx-mn),explain:'最多 '+mx+' 个、最少 '+mn+' 个，相差 '+(mx-mn)+' 个。',tag:'数据整理'};
    if(q===3) return {stem:intro+'数量最多的是哪一类？',type:'choice',options:shuffle(rng,labels.slice(0,4)),answer:labels[vals.indexOf(mx)],explain:'比较四个数，最大是 '+mx+'，对应 '+labels[vals.indexOf(mx)]+'。',tag:'数据整理'};
    return {stem:intro+labels[0]+' 和 '+labels[1]+' 相差几个？',type:'fill',answer:String(Math.abs(vals[0]-vals[1])),explain:'用大数减小数：'+Math.max(vals[0],vals[1])+'-'+Math.min(vals[0],vals[1])+'='+Math.abs(vals[0]-vals[1])+' 个。',tag:'数据整理'};
  },
  frac: function(rng,p){
    var B=[
      ['把一个蛋糕平均分成 4 份，其中 1 份是几分之一？','1/4',['1/2','1/3','1/4','1/5']],
      ['把一个图形平均分成 5 份，取其中 3 份，用分数怎么表示？','3/5',['1/5','3/5','5/3','2/5']],

/* 生成一套题：base 15 + boost 10 自动判分，hard 5 挂《五星学霸》苏教版 第3关/强基 */
function buildQuiz(stage, attempt){
  attempt = attempt || 1;
  var seed = hashStr(stage.id + '#' + attempt);
  var rng = rngFrom(seed);
  var out = [];
  function emit(list, level){
    list.forEach(function(spec){
      var name=spec[0], n=spec[1], params=spec[2]||{};
      for(var i=0;i<n;i++){
        var q = G[name](rng, params);
        if(!q || !q.stem || String(q.answer).length===0) throw new Error('生成失败: '+stage.id+' / '+name);
        q.level = level; q.gen = name; q.id = out.length;
        out.push(q);
      }
    });
  }
  emit(stage.base, 'base');
  emit(stage.boost, 'boost');
  var hard = (stage.challenge||[]).map(function(c,i){
    return {id:out.length+i, level:'hard', type:'manual', stem:c.skill, book:c.book, ref:c.ref, answer:null, explain:'《五星学霸》苏教版原题（第3关·练思维 / 从课本到强基），纸笔完成后由家长核对并勾选「讲题通过」。'};
  });
  return { base:out.slice(0,15), boost:out.slice(15,25), hard:hard, seed:seed };
}

function judgeQuiz(quiz, answers, settings){
  var auto = quiz.base.concat(quiz.boost);
  var res = { baseRight:0, boostRight:0, totalRight:0, autoTotal:auto.length, detail:{}, challengeDone:0, passed:false, reasons:[] };
  auto.forEach(function(q){
    var given = answers[q.id];
    var ok = given!=null && normAns(given)===normAns(q.answer);
    res.detail[q.id] = ok;
    if(ok){ res.totalRight++; if(q.level==='base') res.baseRight++; else res.boostRight++; }
  });
  quiz.hard.forEach(function(q){ if(answers[q.id] && answers[q.id].done) res.challengeDone++; });
  var baseRate = res.baseRight/15, boostRate = res.boostRight/10, totalRate = res.totalRight/25;
  if(baseRate < settings.baseMin) res.reasons.push('基础正确率 '+Math.round(baseRate*100)+'%，未达到 '+Math.round(settings.baseMin*100)+'%');
  if(boostRate < settings.boostMin) res.reasons.push('拔高正确率 '+Math.round(boostRate*100)+'%，未达到 '+Math.round(settings.boostMin*100)+'%');
  if(totalRate < settings.totalMin) res.reasons.push('总正确率 '+Math.round(totalRate*100)+'%，未达到 '+Math.round(settings.totalMin*100)+'%');
  if(settings.parentCheck && res.challengeDone < settings.challengeMin)
    res.reasons.push('挑战题家长验收 '+res.challengeDone+'/5，未达到 '+settings.challengeMin+'/5');
  res.passed = res.reasons.length===0;
  res.rates = { base:baseRate, boost:boostRate, total:totalRate };
  return res;
}

/* 回补诊断阶段：允许「只测不逐日打卡」，避免为了补一年级内容而长期脱离当前校内进度。
   是否启用由 settings.quickPass 控制，设置里可关掉恢复严格按天推进。 */
var QUICK_IDS = ['A1','A2','A3','B1','C1','D1'];
DATA.boards.forEach(function(b){
  b.stages.forEach(function(s){ if(QUICK_IDS.indexOf(s.id)>=0) s.quick = true; });
});

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { DATA:DATA, G:G, buildQuiz:buildQuiz, judgeQuiz:judgeQuiz, rngFrom:rngFrom, hashStr:hashStr, normAns:normAns };
}

<script id="app">
(function(){
/* ================= 基础 ================= */
var KEY='detective_workbench_v1', OLDKEY='sjb_math_workbench_v1';
var D=DATA, S=null, view='checkin';
var sel=null, mview='stage', quizCache=null, gradeCache=null;
var rope={left:900, full:900, timer:null, running:false};
var redo=null, toastTimer=null;
var DEFAULT_ITEMS=['数学闯关 · 今日任务','跳绳 15~20 分钟','课外阅读 20 分钟','英语单词 5 个','讲题 1 道给家长听'];

function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('本地存储写入失败');}}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2400);}
function hashLike(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h.toString(36);}

function load(){
  try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw);}catch(e){S=null;}
  if(!S||S.version!==1)S=null;
  if(!S){
    S={version:1,settings:JSON.parse(JSON.stringify(D.settings)),stages:{},checkins:{},created:today(),
       todo:{items:[],logs:{}},points:{earned:0,spent:0,history:[]},mistakes:[],mistakeSeq:100,lastStage:null};
    try{var old=localStorage.getItem(OLDKEY);
      if(old){var o=JSON.parse(old);
        if(o&&o.version===1){
          S.stages=o.stages||{};S.checkins=o.checkins||{};
          if(o.lastStage)S.lastStage=o.lastStage;
          if(o.settings)['baseMin','boostMin','totalMin','challengeMin','dailyMinutes','parentCheck','quickPass'].forEach(function(k){if(o.settings[k]!==undefined)S.settings[k]=o.settings[k];});
        }}
    }catch(e){}
  }
  var def=JSON.parse(JSON.stringify(D.settings));
  Object.keys(def).forEach(function(k){if(S.settings[k]===undefined)S.settings[k]=def[k];});
  var pts={ptsPerItem:5,dailyCap:100,redeemCost:50};
  Object.keys(pts).forEach(function(k){if(S.settings[k]===undefined)S.settings[k]=pts[k];});
  if(!S.todo)S.todo={items:[],logs:{}};
  if(!S.points)S.points={earned:0,spent:0,history:[]};
  if(!S.mistakes)S.mistakes=[];
  if(!S.mistakeSeq)S.mistakeSeq=100;
  if(!S.todo.items.length)S.todo.items=DEFAULT_ITEMS.map(function(t){return {id:'t'+hashLike(t),label:t};});
  save();
}

/* ================= 数学：阶段状态（沿用原工作台逻辑） ================= */
function allStages(){var a=[];D.boards.forEach(function(b){b.stages.forEach(function(s){a.push({board:b,stage:s});});});return a;}
function findStage(id){var r=null;D.boards.forEach(function(b){b.stages.forEach(function(s){if(s.id===id)r={board:b,stage:s};});});return r;}
function boardOf(id){var r=null;D.boards.forEach(function(b){if(b.id===id)r=b;});return r;}
function st(id){if(!S.stages[id])S.stages[id]={learned:[],quizAttempt:1,answers:{},grade:null,passed:false,unlockedAt:null,challengeRefs:null};return S.stages[id];}
function isFirst(id){var b=boardOf(id[0]);return b&&b.stages[0].id===id;}
function prevId(id){var b=boardOf(id[0]);if(!b)return null;var i=-1;b.stages.forEach(function(s,k){if(s.id===id)i=k;});return i>0?b.stages[i-1].id:null;}
function unlocked(id){if(isFirst(id))return true;var p=prevId(id);return !!(p&&S.stages[p]&&S.stages[p].passed);}
function nextId(id){var b=boardOf(id[0]);if(!b)return null;var i=-1;b.stages.forEach(function(s,k){if(s.id===id)i=k;});return (i>=0&&i<b.stages.length-1)?b.stages[i+1].id:null;}
function boardStat(b){var total=b.stages.length,pass=0,unlock=0;b.stages.forEach(function(s){if(S.stages[s.id]&&S.stages[s.id].passed)pass++;if(unlocked(s.id))unlock++;});return {total:total,pass:pass,unlock:unlock};}
function todayTask(){var list=allStages();
  for(var i=0;i<list.length;i++){var x=list[i],id=x.stage.id,r=st(id);
    if(!unlocked(id)||r.passed)continue;
    var idx=r.learned.length;
    if(idx<x.stage.plan.length)return {board:x.board,stage:x.stage,day:idx,text:x.stage.plan[idx],r:r};
    return {board:x.board,stage:x.stage,day:idx,text:'全部学习内容已过完，去做阶段测试（30 题）',r:r,ready:true};
  }
  return null;}

/* ================= 今日打卡 + 积分 ================= */
function dayLog(d){var k=d||today();if(!S.todo.logs[k])S.todo.logs[k]={done:[],earned:0};return S.todo.logs[k];}
function itemLabel(id){var it=S.todo.items.filter(function(x){return x.id===id;})[0];return it?it.label:'已删除项';}
function hist(action,delta){S.points.history.unshift({d:today(),a:action,x:delta});if(S.points.history.length>200)S.points.history.length=200;}
function availablePts(){return Math.max(0,(S.points.earned||0)-(S.points.spent||0));}
function toggleItem(id){
  var log=dayLog(),cap=S.settings.dailyCap,pts=S.settings.ptsPerItem;
  var i=log.done.indexOf(id);
  if(i<0){
    if(log.earned>=cap){toast('今日积分已满 '+cap+'，明天继续加油！');return;}
    log.done.push(id);log.earned+=pts;S.points.earned+=pts;
    hist('完成打卡「'+itemLabel(id)+'」',pts);toast('+'+pts+' 积分！');
  }else{
    log.done.splice(i,1);log.earned=Math.max(0,log.earned-pts);S.points.earned=Math.max(0,S.points.earned-pts);
    hist('取消打卡「'+itemLabel(id)+'」',-pts);
  }
  save();renderAll();
}
function addItem(label){
  label=(label||'').trim();
  if(!label){toast('先写一项内容');return;}
  var dup=S.todo.items.some(function(x){return x.label===label;});
  if(dup){toast('这一项已经在清单里了');return;}
  S.todo.items.push({id:'t'+hashLike(label)+Date.now().toString(36),label:label});
  save();renderAll();
}
function removeItem(id){
  var log=dayLog(),pts=S.settings.ptsPerItem;
  var i=log.done.indexOf(id);
  if(i>=0){log.done.splice(i,1);log.earned=Math.max(0,log.earned-pts);S.points.earned=Math.max(0,S.points.earned-pts);hist('删除打卡项「'+itemLabel(id)+'」',-pts);}
  S.todo.items=S.todo.items.filter(function(x){return x.id!==id;});
  save();renderAll();
}
function checkMathTodo(){
  var it=S.todo.items.filter(function(x){return x.label.indexOf('数学闯关')===0;})[0];
  if(!it)return;
  var log=dayLog(),cap=S.settings.dailyCap,pts=S.settings.ptsPerItem;
  if(log.done.indexOf(it.id)>=0)return;
  if(log.earned>=cap)return;
  log.done.push(it.id);log.earned+=pts;S.points.earned+=pts;
  hist('完成打卡「'+it.label+'」',pts);
}
function streak(){var n=0,d=new Date();
  for(var i=0;i<400;i++){var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var lg=S.todo.logs[k];
    if(lg&&lg.done&&lg.done.length)n++;else if(i>0)break;
    d.setDate(d.getDate()-1);}
  return n;}

/* ================= 错题本 ================= */
function collectMistakes(quiz,grade,sid,attempt){
  var arr=quiz.base.concat(quiz.boost);
  arr.forEach(function(q){
    if(grade.detail[q.id]!==false)return;
    var dup=S.mistakes.some(function(m){return !m.solved&&m.sid===sid&&m.stem===q.stem;});
    if(dup)return;
    S.mistakes.push({sid:sid,attempt:attempt,qid:q.id,level:q.level,stem:q.stem,options:q.options||null,answer:q.answer,my:'',gen:q.gen||'',tag:q.tag||'',explain:q.explain||'',ts:Date.now(),solved:false});
  });
  if(S.mistakes.length>400)S.mistakes.splice(0,S.mistakes.length-400);
}
function misStat(){var open=0,solved=0;S.mistakes.forEach(function(m){if(m.solved)solved++;else open++;});return {open:open,solved:solved};}

/* ================= 跳绳 ================= */
function fmtSec(n){var m=Math.floor(n/60),s=n%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function ropeTick(){
  rope.left--;
  if(rope.left<=0){rope.left=0;ropePause();toast('15 分钟到！跳绳完成，去打卡吧 🎉');}
  var el=document.getElementById('ropeTime');if(el)el.textContent=fmtSec(rope.left);
  var btn=document.getElementById('ropeToggle');if(btn)btn.textContent=rope.running?'暂停':'开始';
}
function ropeStart(){if(rope.running)return;rope.running=true;rope.timer=setInterval(ropeTick,1000);var b=document.getElementById('ropeToggle');if(b)b.textContent='暂停';}
function ropePause(){rope.running=false;clearInterval(rope.timer);rope.timer=null;var b=document.getElementById('ropeToggle');if(b)b.textContent='开始';}
function ropeReset(){ropePause();rope.left=rope.full;var el=document.getElementById('ropeTime');if(el)el.textContent=fmtSec(rope.left);}
function ropeDone(){
  var it=S.todo.items.filter(function(x){return x.label.indexOf('跳绳')>=0;})[0];
  if(!it){addItem('跳绳 15~20 分钟');it=S.todo.items.filter(function(x){return x.label.indexOf('跳绳')>=0;})[0];}
  var log=dayLog();
  if(log.done.indexOf(it.id)>=0){toast('今天跳绳已经打卡过了 ✅');return;}
  toggleItem(it.id);
}
function ropeWeek(){
  var it=S.todo.items.filter(function(x){return x.label.indexOf('跳绳')>=0;})[0];
  if(!it)return 0;
  var n=0,d=new Date();
  for(var i=0;i<7;i++){var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var lg=S.todo.logs[k];if(lg&&lg.done&&lg.done.indexOf(it.id)>=0)n++;
    d.setDate(d.getDate()-1);}
  return n;
}

  document.getElementById('nbMis').textContent=String(misStat().open);
  document.getElementById('nbPts').textContent=String(availablePts());

  h+='<div class="row" style="margin:16px 0"><button class="btn primary" id="btnSubmit">提交判分</button><button class="btn" id="btnNewSet">换一套（重出 30 题）</button><span class="tiny">同一套题面固定；换一套才变。</span></div>';
  function bind(pane){
    pane.querySelector('#btnBack').addEventListener('click',function(){mview='stage';gradeCache=null;renderMath(document.getElementById('main'));});
    pane.querySelectorAll('[data-fill]').forEach(function(inp){inp.addEventListener('input',function(){r.answers[inp.dataset.fill]=inp.value;save();});});
    pane.querySelectorAll('[data-opt]').forEach(function(btn){btn.addEventListener('click',function(){var box=btn.closest('.q'),id=box.dataset.q;r.answers[id]=btn.dataset.opt;save();box.querySelectorAll('.opt').forEach(function(x){x.classList.remove('on');});btn.classList.add('on');});});
    pane.querySelectorAll('[data-done]').forEach(function(ck){ck.addEventListener('change',function(){var id=ck.dataset.done;r.answers[id]=r.answers[id]||{};r.answers[id].done=ck.checked;save();});});
    pane.querySelectorAll('[data-ref]').forEach(function(inp){inp.addEventListener('input',function(){r.challengeRefs=r.challengeRefs||{};r.challengeRefs[inp.dataset.ref]=inp.value;save();});});
    pane.querySelector('#btnNewSet').addEventListener('click',function(){r.quizAttempt++;r.answers={};save();quizCache=buildQuiz(s,r.quizAttempt);renderMath(document.getElementById('main'));window.scrollTo(0,0);});
    pane.querySelector('#btnSubmit').addEventListener('click',function(){
      gradeCache=judgeQuiz(quizCache,r.answers,S.settings);
      r.grade={baseRight:gradeCache.baseRight,boostRight:gradeCache.boostRight,totalRight:gradeCache.totalRight,rates:gradeCache.rates,passed:gradeCache.passed,challengeDone:gradeCache.challengeDone,attempt:r.quizAttempt};
      if(gradeCache.passed){r.passed=true;if(!r.unlockedAt)r.unlockedAt=today();}
      collectMistakes(quizCache,gradeCache,s.id,r.quizAttempt);
      save();mview='grade';renderMath(document.getElementById('main'));window.scrollTo(0,0);
    });
  }
  return {html:h,bind:bind};
}
function gradeHtml(b,s,r){
  var q=quizCache||buildQuiz(s,r.quizAttempt),ans=r.answers||{};
  var g=gradeCache||judgeQuiz(q,ans,S.settings);
  var h='<div class="phead"><div class="row" style="justify-content:space-between"><div><h2>'+s.id+' · 判分结果（第 '+r.quizAttempt+' 套）</h2><div class="sub">'+b.name+' ｜ '+esc(s.title)+'</div></div><button class="btn sm" id="btnBack">返回阶段</button></div></div>';
  h+='<div class="grade '+(g.passed?'pass':'fail')+'"><b>'+(g.passed?'✅ 达标！已解锁下一阶段：'+(nextId(s.id)||'（本板块已全部完成）'):'⏳ 未达标，下一阶段仍锁定')+'</b>'+
     '<div style="margin-top:6px">基础 '+g.baseRight+'/15（'+Math.round(g.rates.base*100)+'%）｜ 拔高 '+g.boostRight+'/10（'+Math.round(g.rates.boost*100)+'%）｜ 总 '+g.totalRight+'/25（'+Math.round(g.rates.total*100)+'%）｜ 挑战验收 '+g.challengeDone+'/5</div>'+
     (g.reasons.length?'<div style="margin-top:6px;color:#92400e">未达标原因：'+g.reasons.map(esc).join('；')+'</div>':'')+
     '<div style="margin-top:6px" class="tiny">答错的题已自动收进「错题本」，去那里重做和举一反三。</div></div>';
  h+='<div class="row" style="margin:14px 0"><button class="btn" id="btnRetry">换一套重做</button><button class="btn" id="btnGoMis">去错题本</button><span class="tiny">历史最好成绩保留在阶段页。</span></div>';
  var idx=0;
  [['base','基础题','#16a34a'],['boost','拔高题','#d97706'],['hard','挑战题','#dc2626']].forEach(function(cfg){
    h+='<h4 class="sec" style="border-color:'+cfg[2]+'">'+cfg[1]+'</h4>';
    q[cfg[0]].forEach(function(item){h+=qCard(item,idx++,ans[item.id],true,function(id){return g.detail[id];},s.id);});
  });
  function bind(pane){
    pane.querySelector('#btnBack').addEventListener('click',function(){mview='stage';gradeCache=null;renderMath(document.getElementById('main'));});
    pane.querySelector('#btnGoMis').addEventListener('click',function(){view='mistake';renderAll();});
    pane.querySelector('#btnRetry').addEventListener('click',function(){r.quizAttempt++;r.answers={};save();quizCache=buildQuiz(s,r.quizAttempt);gradeCache=null;mview='quiz';renderMath(document.getElementById('main'));window.scrollTo(0,0);});
    pane.querySelectorAll('[data-done]').forEach(function(ck){ck.addEventListener('change',function(){var id=ck.dataset.done;r.answers[id]=r.answers[id]||{};r.answers[id].done=ck.checked;save();});});
  }
  return {html:h,bind:bind};
}

/* ================= 错题本页 ================= */
function renderMistake(m){
  document.getElementById('avatar').src=IMGS.think;
  var stt=misStat(),total=stt.open+stt.solved;
  var pct=total?Math.round(stt.solved/total*100):0;
  var h='<div class="hero"><div><h1>错题本 · 举一反三</h1><p>测试里做错的题会自动收进来 ｜ 重做原题，或换一道同类型新题，答对即消灭</p></div><img src="'+IMGS.think+'" alt="柯南"></div>';
  h+='<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">消灭进度</h3><span class="tiny">待消灭 '+stt.open+' ｜ 已消灭 '+stt.solved+'</span></div><div class="row" style="margin-top:10px"><div class="bar" style="flex:1"><i style="width:'+pct+'%;background:#f59e0b"></i></div><b>'+pct+'%</b></div></div>';
  var open=S.mistakes.filter(function(x){return !x.solved;}).reverse();
  h+='<h4 class="sec" style="border-color:#dc2626">待消灭（'+open.length+'）</h4>';
  if(!open.length)h+='<div class="card" style="text-align:center;color:#166534"><b>侦探笔记干干净净，一处错题都没有！🎉</b><div class="tiny" style="margin-top:4px">做错的新题会自动出现在这里。</div></div>';
  open.forEach(function(mi){h+=misCard(mi,false);});
  var doneList=S.mistakes.filter(function(x){return x.solved;}).slice(-12).reverse();
  if(doneList.length){
    h+='<h4 class="sec" style="border-color:#16a34a">最近已消灭（'+doneList.length+'）</h4>';
    doneList.forEach(function(mi){h+=misCard(mi,true);});
  }
  m.innerHTML=h;
  m.querySelectorAll('[data-redo]').forEach(function(b){b.addEventListener('click',function(){openRedo(b.dataset.redo,'redo');});});
  m.querySelectorAll('[data-newq]').forEach(function(b){b.addEventListener('click',function(){openRedo(b.dataset.newq,'new');});});
}
function misCard(mi,solved){
  var f=findStage(mi.sid);
  var h='<div class="mcard '+(solved?'solved':'')+'"><div class="mhead"><span class="tag '+(mi.level==='base'?'g':'y')+'">'+(mi.level==='base'?'基础':'拔高')+'</span><span class="tag p">'+esc(mi.tag||'')+'</span><span class="tiny">'+(f?f.board.name+' · ':'')+mi.sid+'</span>'+(solved?'<span class="tag g">✔ 已消灭</span>':'')+'</div>';
  h+='<div class="stem" style="margin-bottom:8px">'+esc(mi.stem)+'</div>';
  if(!solved){
    h+='<div class="tiny">正确答案：<b>'+esc(mi.answer)+'</b>'+(mi.my?' ｜ 你当时答：'+esc(mi.my):'')+'</div>';
    if(mi.explain)h+='<div class="ex" style="margin-top:8px">'+esc(mi.explain)+'</div>';
    h+='<div class="row" style="margin-top:12px"><button class="btn sm primary" data-redo="'+mi.ts+'">重做原题</button><button class="btn sm warn" data-newq="'+mi.ts+'">举一反三（同类型新题）</button></div>';
  }
  h+='</div>';
  return h;
}
function openRedo(ts,mode){
  var mi=S.mistakes.filter(function(x){return x.ts===Number(ts);})[0];
  if(!mi)return;
  var f=findStage(mi.sid);
  if(!f){toast('找不到对应阶段');return;}
  var att=mode==='redo'?mi.attempt:(++S.mistakeSeq);
  var z=buildQuiz(f.stage,att);
  var q=z.base.concat(z.boost)[mi.qid];
  if(!q){toast('题目生成异常，请重试');return;}
  redo={mi:mi,q:q,mode:mode,given:null,ok:null};
  showRedoModal();
}
function showRedoModal(){
  var old=document.getElementById('modal');if(old)old.remove();
  var m=document.createElement('div');m.id='modal';m.className='modal';
  var q=redo.q;
  var h='<div class="mbox"><h3 style="margin:0 0 4px">'+(redo.mode==='redo'?'重做原题':'举一反三 · 同类型新题')+'</h3><div class="tiny" style="margin-bottom:12px">'+esc(redo.mi.sid)+' ｜ '+esc(q.tag||'')+' ｜ 答对即消灭这道错题</div>';
  h+='<div class="stem">'+esc(q.stem)+'</div>';
  if(q.type==='choice'){
    h+='<div class="opts">'+q.options.map(function(o){return '<button class="opt" data-ropt="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div>';
  }else{
    h+='<div class="row"><input type="text" id="rfill" placeholder="填答案" style="flex:1"><button class="btn primary" id="rSubmit">提交</button></div>';
  }
  h+='<div id="rResult" style="margin-top:14px"></div><div class="row" style="margin-top:14px"><button class="btn" id="rClose">关闭</button><span class="tiny">答对后这道错题标记为已消灭。</span></div></div>';
  m.innerHTML=h;document.body.appendChild(m);
  function judge(given){
    redo.given=given;redo.ok=normAns(given)===normAns(q.answer);
    var box=m.querySelector('#rResult');
    if(redo.ok){
      redo.mi.solved=true;redo.mi.solvedAt=today();redo.mi.via=redo.mode;save();renderNav();
      box.innerHTML='<div class="grade pass"><b>✔ 答对了！这道错题已消灭 🎉</b><div class="tiny" style="margin-top:4px">解析：'+esc(q.explain||'')+'</div></div>';
    }else{
      box.innerHTML='<div class="grade fail"><b>✘ 再想想，正确答案是：'+esc(q.answer)+'</b><div class="tiny" style="margin-top:4px">解析：'+esc(q.explain||'')+'</div></div>';
    }
    box.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
    var rf=m.querySelector('#rfill');if(rf)rf.disabled=true;
    var rs=m.querySelector('#rSubmit');if(rs)rs.disabled=true;
  }
  m.querySelectorAll('[data-ropt]').forEach(function(b){b.addEventListener('click',function(){if(redo.ok!==null)return;m.querySelectorAll('[data-ropt]').forEach(function(x){x.classList.remove('on');});b.classList.add('on');judge(b.dataset.ropt);});});
  var rs=m.querySelector('#rSubmit');
  if(rs)rs.addEventListener('click',function(){var v=m.querySelector('#rfill').value;if(v===''||v==null){toast('先填个答案');return;}judge(v);});
  m.querySelector('#rClose').addEventListener('click',function(){m.remove();redo=null;renderMain();});
}

/* ================= 跳绳页 ================= */
function renderRope(m){
  document.getElementById('avatar').src=IMGS.move;
  var h='<div class="hero"><div><h1>跳绳运动</h1><p>每天 15~20 分钟 ｜ 计时到了点「完成打卡」领积分</p></div><img src="'+IMGS.move+'" alt="柯南"></div>';
  h+='<div class="card" style="text-align:center"><div class="ropeTime" id="ropeTime">'+fmtSec(rope.left)+'</div>'+
     '<div class="row" style="justify-content:center"><button class="btn primary" id="ropeToggle">'+(rope.running?'暂停':'开始')+'</button><button class="btn" id="ropeResetBtn">重置</button></div>'+
     '<div class="tiny" style="margin-top:10px">倒计时 '+fmtSec(rope.full)+'；中途切去别的页面计时不会停。</div></div>';
  var log=dayLog(),rit=S.todo.items.filter(function(x){return x.label.indexOf('跳绳')>=0;})[0];
  var doneToday=rit&&log.done.indexOf(rit.id)>=0;
  h+='<div class="card"><div class="row" style="justify-content:space-between"><div><b>完成今日跳绳</b><div class="tiny">'+(doneToday?'今天已打卡 ✅':'跳完点这里，+'+S.settings.ptsPerItem+' 积分')+'</div></div><button class="btn '+(doneToday?'':'warn')+'" id="ropeDoneBtn" '+(doneToday?'disabled':'')+'>完成打卡</button></div></div>';
  h+='<div class="card"><h3>本周战报</h3><div class="row"><div class="kcard k-g" style="flex:1"><b>'+ropeWeek()+' 天</b>最近 7 天完成跳绳</div><div class="kcard k-y" style="flex:1"><b>'+fmtSec(rope.full)+'</b>每次目标时长</div></div></div>';
  m.innerHTML=h;
  m.querySelector('#ropeToggle').addEventListener('click',function(){if(rope.running)ropePause();else ropeStart();});
  m.querySelector('#ropeResetBtn').addEventListener('click',ropeReset);
  m.querySelector('#ropeDoneBtn').addEventListener('click',ropeDone);
}

/* ================= 奖励页 ================= */
function renderReward(m){
  document.getElementById('avatar').src=IMGS.happy;
  var av=availablePts(),cost=S.settings.redeemCost,can=Math.floor(av/cost);
  var pct=Math.round((av%cost)/cost*100);
  var h='<div class="hero"><div><h1>奖励兑换</h1><p>积分攒到 '+cost+'，就能兑换一集《名侦探柯南》！</p></div><img src="'+IMGS.happy+'" alt="柯南"></div>';
  h+='<div class="grid3"><div class="kcard k-g"><span>可用积分</span><b>'+av+'</b>现在就能花的</div><div class="kcard k-y"><span>累计获得</span><b>'+S.points.earned+'</b>坚持打卡赚来的</div><div class="kcard k-p"><span>已兑换</span><b>'+Math.floor((S.points.spent||0)/cost)+' 集</b>柯南看过的快乐</div></div>';
  h+='<div class="card"><div class="row" style="gap:18px"><div class="ring" style="--p:'+pct+'"><b>'+pct+'%</b></div><div style="flex:1;min-width:0"><h3 style="margin:0 0 6px">距下一次兑换还差 '+(cost-av%cost)+' 积分</h3><div class="bar"><i style="width:'+pct+'%;background:#f59e0b"></i></div><div class="tiny" style="margin-top:8px">每完成一项打卡 +'+S.settings.ptsPerItem+' 分，每天最多 '+S.settings.dailyCap+' 分。当前够兑 '+can+' 集。</div></div><button class="btn primary" id="btnRedeem" '+(av>=cost?'':'disabled')+'>'+(av>=cost?'兑换一集柯南（-'+cost+' 分）':'积分不够 '+cost+' 分')+'</button></div></div>';
  h+='<div class="card"><h3>积分流水</h3>';
  if(!S.points.history.length)h+='<div class="tiny">还没有记录，去打卡赚积分吧。</div>';
  S.points.history.slice(0,15).forEach(function(x){
    h+='<div class="hist"><span>'+x.d+' ｜ '+esc(x.a)+'</span><span class="x" style="color:'+(x.x>=0?'#166534':'#b91c1c')+'">'+(x.x>=0?'+':'')+x.x+'</span></div>';
  });
  h+='</div>';
  m.innerHTML=h;
  var rb=m.querySelector('#btnRedeem');
  if(rb)rb.addEventListener('click',function(){
    if(availablePts()<cost){toast('积分还不够');return;}
    if(!confirm('用 '+cost+' 积分兑换一集《名侦探柯南》？\n（兑换后找家长播放）'))return;
    S.points.spent=(S.points.spent||0)+cost;
    hist('兑换《名侦探柯南》一集',-cost);
    save();toast('兑换成功！去找家长播一集吧 🎉');renderAll();
  });
}

/* ================= 设置 / 导入导出 ================= */
function openSettings(){
  var s=S.settings;
  var h='<h3 style="margin:0 0 10px">设置</h3><div class="hr"></div>'+
    '<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="setParent" '+(s.parentCheck?'checked':'')+'> 挑战题需要家长验收（勾选讲题通过才计入解锁）</label>'+
    '<div style="height:8px"></div>'+
    '<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="setQuick" '+(s.quickPass?'checked':'')+'> 回补诊断阶段允许「只测不逐日打卡」（A1~A3、B1、C1、D1）</label>'+
    '<div class="hr"></div><table>'+
    '<tr><th>基础正确率 ≥</th><td><input type="number" id="setBase" min="0" max="1" step="0.05" value="'+s.baseMin+'"></td></tr>'+
    '<tr><th>拔高正确率 ≥</th><td><input type="number" id="setBoost" min="0" max="1" step="0.05" value="'+s.boostMin+'"></td></tr>'+
    '<tr><th>总正确率 ≥</th><td><input type="number" id="setTotal" min="0" max="1" step="0.05" value="'+s.totalMin+'"></td></tr>'+
    '<tr><th>挑战题验收 ≥</th><td><input type="number" id="setChal" min="0" max="5" step="1" value="'+s.challengeMin+'"></td></tr>'+
    '<tr><th>每项打卡积分</th><td><input type="number" id="setPts" min="1" max="20" step="1" value="'+s.ptsPerItem+'"></td></tr>'+
    '<tr><th>每日积分上限</th><td><input type="number" id="setCap" min="10" max="500" step="10" value="'+s.dailyCap+'"></td></tr>'+
    '<tr><th>兑换一集柯南所需</th><td><input type="number" id="setCost" min="10" max="1000" step="10" value="'+s.redeemCost+'"></td></tr>'+
    '</table><div class="hr"></div><div class="row"><button class="btn primary" id="setSave">保存</button><button class="btn" id="setCancel">取消</button><button class="btn" id="setReset" style="margin-left:auto;color:#b91c1c">重置全部进度</button></div>';
  var old=document.getElementById('modal');if(old)old.remove();
  var m=document.createElement('div');m.id='modal';m.className='modal';
  var box=document.createElement('div');box.className='mbox';box.innerHTML=h;m.appendChild(box);document.body.appendChild(m);
  box.querySelector('#setCancel').onclick=function(){m.remove();};
  box.querySelector('#setSave').onclick=function(){
    s.parentCheck=box.querySelector('#setParent').checked;
    s.quickPass=box.querySelector('#setQuick').checked;
    s.baseMin=parseFloat(box.querySelector('#setBase').value)||0;
    s.boostMin=parseFloat(box.querySelector('#setBoost').value)||0;
    s.totalMin=parseFloat(box.querySelector('#setTotal').value)||0;
    s.challengeMin=parseInt(box.querySelector('#setChal').value,10)||0;
    s.ptsPerItem=parseInt(box.querySelector('#setPts').value,10)||5;
    s.dailyCap=parseInt(box.querySelector('#setCap').value,10)||100;
    s.redeemCost=parseInt(box.querySelector('#setCost').value,10)||50;
    save();m.remove();renderAll();toast('设置已保存');
  };
  box.querySelector('#setReset').onclick=function(){
    if(!confirm('这会清空所有打卡、积分、错题、成绩和解锁状态，且无法撤销。建议先「导出」。确定重置？'))return;
    if(!confirm('再确认一次：真的清空全部进度？'))return;
    localStorage.removeItem(KEY);S=null;load();sel=null;mview='stage';quizCache=null;gradeCache=null;m.remove();renderAll();
  };
}
function exportProgress(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='小侦探工作台进度_'+today()+'.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  toast('已导出到下载目录');
}
function importProgress(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var obj=JSON.parse(fr.result);
      if(!obj||obj.version!==1)throw new Error('格式不对');
      S=obj;save();sel=null;mview='stage';quizCache=null;gradeCache=null;renderAll();toast('导入成功');
    }catch(e){toast('导入失败：'+e.message);}
  };
  fr.readAsText(file);
}

/* ================= 启动 ================= */
document.querySelectorAll('.navi').forEach(function(b){
  b.addEventListener('click',function(){view=b.dataset.view;renderAll();window.scrollTo(0,0);});
});
document.getElementById('btnSettings').addEventListener('click',openSettings);
document.getElementById('btnExport').addEventListener('click',exportProgress);
document.getElementById('btnImport').addEventListener('click',function(){document.getElementById('fileImport').click();});
document.getElementById('fileImport').addEventListener('change',function(e){if(e.target.files[0])importProgress(e.target.files[0]);e.target.value='';});
document.getElementById('avatar').src=IMGS.checkin;
load();
if(S.lastStage&&findStage(S.lastStage)&&unlocked(S.lastStage)){sel=S.lastStage;}
var _t=todayTask();if(!sel)sel=_t?_t.stage.id:'A1';
renderAll();
})();
</script>
